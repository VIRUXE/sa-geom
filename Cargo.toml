[workspace]
resolver = "2"
members = ["crates/sa-formats", "crates/sa-world", "crates/sa-geom-cli", "crates/sa-geom-mta", "crates/sa-geom-samp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/VIRUXE/sa-geom"
homepage = "https://github.com/VIRUXE/sa-geom"
keywords = ["gta", "san-andreas", "mta", "samp", "collision"]
categories = ["game-development"]
readme = "README.md"

[workspace.dependencies]
sa-formats = { path = "crates/sa-formats" }
sa-world = { path = "crates/sa-world" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
